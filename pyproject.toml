[project]
name = "upload-app-mcp"
version = "0.1.0"
description = "MCP server para enviar .aab para a Google Play e .ipa para o TestFlight e promover para produção, usando fastlane"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastmcp>=2.0.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
]

[project.scripts]
upload-app-mcp = "upload_app_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["upload_app_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
